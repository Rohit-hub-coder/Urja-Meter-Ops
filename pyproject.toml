[project]
name = "urja-meter-ops-api"
version = "0.1.0"
description = "Clean, resilient API service and synchronization layer in front of legacy Urja Meter Ops portal."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Rohit Kumar", email = "23_se_129@dtu.ac.in" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "docs", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
